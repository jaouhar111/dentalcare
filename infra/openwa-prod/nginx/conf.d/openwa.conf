# Reverse proxy — terminates TLS for OpenWA's REST API + Dashboard.
#
# Replace `openwa.dentalcare.ma` with your actual domain before running
# `docker compose up`. The certs live in /etc/letsencrypt/live/<domain>/
# inside the certbot volume; we mount the same volume read-only here so
# nginx picks up renewals without a restart.

server {
    listen 80;
    listen [::]:80;
    server_name openwa.dentalcare.ma;

    # ACME challenge — Let's Encrypt looks for token files here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openwa.dentalcare.ma;

    ssl_certificate /etc/nginx/certs/live/openwa.dentalcare.ma/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/openwa.dentalcare.ma/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # OpenWA sends large base64 payloads when proxying media; bump the
    # default 1 MB cap to 25 MB. WhatsApp itself caps media at 16 MB.
    client_max_body_size 25m;

    # Long-lived webhooks — extend read timeouts so a slow DentalCare
    # handler doesn't get cut off mid-response.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://openwa:2785;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Lightweight health endpoint — for uptime monitoring (UptimeRobot, etc.)
    location = /__healthz {
        access_log off;
        return 200 "ok\n";
    }
}
